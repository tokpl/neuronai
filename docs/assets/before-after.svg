<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cursor alone vs Cursor with neuronai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardBad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3A44"/>
      <stop offset="100%" stop-color="#0B2830"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="90" fill="#22D3EE" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1020" cy="520" r="120" fill="#22D3EE" opacity="0.10" filter="url(#soft)"/>

  <text x="600" y="58" text-anchor="middle" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Add a refund flow</text>
  <text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Same prompt. Different project memory.</text>

  <!-- WITHOUT -->
  <rect x="48" y="120" width="520" height="450" rx="20" fill="url(#cardBad)" stroke="#334155" stroke-width="1.5"/>
  <text x="78" y="168" fill="#F87171" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">WITHOUT neuronai</text>
  <text x="78" y="196" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Generic AI. Generic answers.</text>

  <rect x="78" y="224" width="460" height="78" rx="12" fill="#0B1220" stroke="#475569"/>
  <text x="98" y="256" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">You</text>
  <text x="98" y="280" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">How is auth handled in this project?</text>

  <rect x="78" y="318" width="460" height="120" rx="12" fill="#0B1220" stroke="#475569"/>
  <text x="98" y="350" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Cursor</text>
  <text x="98" y="378" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Authentication typically verifies credentials,</text>
  <text x="98" y="400" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">issues a token, and stores a session…</text>
  <rect x="98" y="416" width="300" height="8" rx="4" fill="#334155"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94A3B8">
    <circle cx="92" cy="478" r="5" fill="#64748B"/>
    <text x="108" y="483">Invents a new pattern</text>
    <circle cx="92" cy="508" r="5" fill="#64748B"/>
    <text x="108" y="513">Skips your domain layer</text>
    <circle cx="92" cy="538" r="5" fill="#64748B"/>
    <text x="108" y="543">Misses past footguns</text>
  </g>

  <!-- WITH -->
  <rect x="632" y="120" width="520" height="450" rx="20" fill="url(#cardGood)" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="662" y="168" fill="#22D3EE" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">WITH neuronai</text>
  <text x="662" y="196" fill="#A5F3FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Project-aware. Grounded in .neuron/</text>

  <rect x="662" y="224" width="460" height="78" rx="12" fill="#04151A" stroke="#155E75"/>
  <text x="682" y="256" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">You</text>
  <text x="682" y="280" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">How is auth handled in this project?</text>

  <rect x="662" y="318" width="460" height="120" rx="12" fill="#04151A" stroke="#155E75"/>
  <text x="682" y="350" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Cursor + neuronai</text>
  <text x="682" y="378" fill="#ECFEFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">NextAuth + credentials provider, JWT sessions.</text>
  <text x="682" y="404" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">From decisions.json · Auth approach</text>
  <text x="682" y="424" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">From decisions.json · Token strategy</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#E2E8F0">
    <circle cx="676" cy="478" r="5" fill="#22D3EE"/>
    <text x="692" y="483">Loads payment / outbox decisions</text>
    <circle cx="676" cy="508" r="5" fill="#22D3EE"/>
    <text x="692" y="513">Respects module boundaries</text>
    <circle cx="676" cy="538" r="5" fill="#22D3EE"/>
    <text x="692" y="543">Surfaces known warnings first</text>
  </g>
</svg>
