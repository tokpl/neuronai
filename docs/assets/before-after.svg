<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title">
  <title id="title">Before vs After NeuronAI</title>
  <rect width="1200" height="480" fill="#FAFAF9"/>
  
  <rect x="40" y="40" width="540" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="40" y="40" width="540" height="52" rx="16" fill="#FFEDD5"/>
  <rect x="40" y="76" width="540" height="16" fill="#FFEDD5"/>
  <text x="310" y="74" fill="#9A3412" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Without NeuronAI</text>
  <text x="70" y="140" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="start">User: Create auth.</text>
  <rect x="70" y="170" width="480" height="220" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="90" y="210" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" text-anchor="start">Cursor</text>
  <text x="90" y="245" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">How do you authenticate users?</text>
  <text x="90" y="275" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">NextAuth, Clerk, or custom JWT?</text>
  <text x="90" y="305" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Where should middleware live?</text>
  <text x="90" y="345" fill="#9A3412" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Starts from zero. Every time.</text>
  <rect x="620" y="40" width="540" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="620" y="40" width="540" height="52" rx="16" fill="#CCFBF1"/>
  <rect x="620" y="76" width="540" height="16" fill="#CCFBF1"/>
  <text x="890" y="74" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">With NeuronAI</text>
  <text x="650" y="140" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="start">User: Create auth.</text>
  <rect x="650" y="170" width="480" height="220" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="670" y="210" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" text-anchor="start">Cursor + NeuronAI</text>
  <text x="670" y="245" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="start">Clerk · middleware.ts</text>
  <text x="670" y="275" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">/(dashboard) · lib/auth.ts</text>
  <text x="670" y="305" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Follows existing architecture.</text>
  <text x="670" y="345" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="start">Consistent. Instantly.</text>

</svg>
