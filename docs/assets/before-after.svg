<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Without NeuronAI vs With NeuronAI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" fill="#22D3EE" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Neuron - AI Memory</text>

  <rect x="48" y="80" width="520" height="500" rx="20" fill="#111827" stroke="#334155"/>
  <text x="78" y="130" fill="#F87171" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">WITHOUT NeuronAI</text>
  <text x="78" y="162" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Generic AI. Generic answers.</text>
  <rect x="78" y="200" width="460" height="200" rx="12" fill="#0B1220" stroke="#475569"/>
  <text x="98" y="240" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="13">Cursor</text>
  <text x="98" y="275" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Auth typically verifies credentials</text>
  <text x="98" y="300" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">and issues a generic token…</text>

  <rect x="632" y="80" width="520" height="500" rx="20" fill="#0B2830" stroke="#22D3EE"/>
  <text x="662" y="130" fill="#22D3EE" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">WITH NeuronAI</text>
  <text x="662" y="162" fill="#A5F3FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Project-aware. Grounded in .neuron/</text>
  <rect x="662" y="200" width="460" height="200" rx="12" fill="#04151A" stroke="#155E75"/>
  <text x="682" y="240" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="13">Cursor + NeuronAI</text>
  <text x="682" y="275" fill="#ECFEFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">NextAuth + JWT - from decisions.json</text>
  <text x="682" y="305" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="13">Neuron - AI Memory context loaded</text>
</svg>
