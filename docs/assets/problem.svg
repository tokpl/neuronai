<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
  <title id="title">The problem — AI forgets your project</title>
  <rect width="1200" height="520" fill="#FAFAF9"/>
  <text x="60" y="48" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start">Every AI coding assistant forgets.</text>
  <rect x="80" y="90" width="1040" height="64" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="130" cy="122" r="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="127" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1</text>
  <text x="180" y="118" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="start">New chat</text>
  <text x="180" y="140" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Explain project again</text><line x1="130" y1="154" x2="130" y2="168" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="80" y="168" width="1040" height="64" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="130" cy="200" r="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="205" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2</text>
  <text x="180" y="196" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="start">Next day</text>
  <text x="180" y="218" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Explain again</text><line x1="130" y1="232" x2="130" y2="246" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="80" y="246" width="1040" height="64" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="130" cy="278" r="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="283" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3</text>
  <text x="180" y="274" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="start">Next week</text>
  <text x="180" y="296" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Explain again</text><line x1="130" y1="310" x2="130" y2="324" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="80" y="324" width="1040" height="64" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="130" cy="356" r="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="361" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">4</text>
  <text x="180" y="352" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="start">Another computer</text>
  <text x="180" y="374" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Explain again</text><line x1="130" y1="388" x2="130" y2="402" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="80" y="402" width="1040" height="64" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="130" cy="434" r="18" fill="#FFEDD5" stroke="#9A3412" stroke-width="2"/>
  <text x="130" y="439" fill="#9A3412" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">5</text>
  <text x="180" y="430" fill="#9A3412" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="start">Frustration</text>
  <text x="180" y="452" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Same loop forever</text>
</svg>
