<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title">
  <title id="title">NeuronAI Quick Start</title>
  <rect width="1200" height="460" fill="#FAFAF9"/>
  <text x="60" y="40" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="start">About two minutes.</text>
  <rect x="60" y="80" width="340" height="200" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="100" cy="130" r="22" fill="#0F766E" />
  <text x="100" y="136" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <text x="140" y="136" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="start">Install</text>
  <text x="88" y="190" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">npm install -g neuronai</text><line x1="400" y1="180" x2="430" y2="180" stroke="#0F766E" stroke-width="2"/>
  <rect x="430" y="80" width="340" height="200" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="470" cy="130" r="22" fill="#0F766E" />
  <text x="470" y="136" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text>
  <text x="510" y="136" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="start">Init</text>
  <text x="458" y="190" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">neuron init</text><line x1="770" y1="180" x2="800" y2="180" stroke="#0F766E" stroke-width="2"/>
  <rect x="800" y="80" width="340" height="200" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="840" cy="130" r="22" fill="#0F766E" />
  <text x="840" y="136" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text>
  <text x="880" y="136" fill="#111111" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="start">Enable</text>
  <text x="828" y="190" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="start">Cursor → Tools &amp; MCP → neuron</text>
  <rect x="60" y="320" width="1080" height="100" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="90" y="380" fill="#6B7280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="start">Then ask: “Where is authentication implemented?”</text>

</svg>
