<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="neuronai terminal demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="520" r="140" fill="#22D3EE" opacity="0.07" filter="url(#glow)"/>
  <circle cx="1040" cy="120" r="110" fill="#22D3EE" opacity="0.08" filter="url(#glow)"/>

  <!-- window -->
  <rect x="120" y="70" width="960" height="490" rx="18" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <rect x="120" y="70" width="960" height="48" rx="18" fill="url(#chrome)"/>
  <rect x="120" y="100" width="960" height="18" fill="url(#chrome)"/>
  <circle cx="156" cy="94" r="7" fill="#EF4444"/>
  <circle cx="180" cy="94" r="7" fill="#F59E0B"/>
  <circle cx="204" cy="94" r="7" fill="#22C55E"/>
  <text x="600" y="100" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">neuronai — demo</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="160" y="170"><tspan fill="#22D3EE">neuronai@demo ~ $</tspan><tspan fill="#F8FAFC"> npx neuronai init</tspan></text>

    <text x="160" y="220" fill="#22C55E">✓</text>
    <text x="188" y="220" fill="#E2E8F0">Creating .neuron/ directory</text>
    <text x="160" y="255" fill="#22C55E">✓</text>
    <text x="188" y="255" fill="#E2E8F0">Scanning project → brain.json</text>
    <text x="160" y="290" fill="#22C55E">✓</text>
    <text x="188" y="290" fill="#E2E8F0">Writing decisions / knowledge / rules</text>
    <text x="160" y="325" fill="#22C55E">✓</text>
    <text x="188" y="325" fill="#E2E8F0">Wiring Cursor MCP (.cursor/mcp.json)</text>

    <text x="160" y="380" fill="#22D3EE">✦ neuronai initialized</text>
    <text x="160" y="420" fill="#94A3B8">Local-first · no Docker · no API key</text>
    <text x="160" y="455" fill="#64748B">Next: Cursor Settings → Tools &amp; MCP → Enable neuron</text>

    <text x="160" y="510"><tspan fill="#22D3EE">neuronai@demo ~/app $</tspan><tspan fill="#F8FAFC"> </tspan><tspan fill="#22D3EE">▌</tspan></text>
  </g>
</svg>
