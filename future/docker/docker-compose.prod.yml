services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuron}
      POSTGRES_DB: ${POSTGRES_DB:-neuron}
    volumes:
      - neuron_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neuron} -d ${POSTGRES_DB:-neuron}']
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-neuron}:${POSTGRES_PASSWORD:-neuron}@postgres:5432/${POSTGRES_DB:-neuron}
      NEURON_MODE: ${NEURON_MODE:-local}
      NEURON_TELEMETRY: ${NEURON_TELEMETRY:-0}
    healthcheck:
      test: ['CMD', 'node', '-e', "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 20s
    # Prefer stdio MCP from hosts; this service is for self-host experiments.
    # Map ports only if HTTP transport is enabled in a future release.

volumes:
  neuron_pg_data:
