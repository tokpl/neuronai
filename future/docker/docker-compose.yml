services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuron
      POSTGRES_PASSWORD: neuron
      POSTGRES_DB: neuron
    ports:
      - '5432:5432'
    volumes:
      - neuron_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuron -d neuron']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neuron_pg_data:
